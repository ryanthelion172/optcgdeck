# Local Postgres for development: `docker compose up -d` from the repo root.
# Data is kept in the "pgdata" volume between restarts. Only reachable from this computer.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: optcg
      POSTGRES_PASSWORD: optcg
      POSTGRES_DB: optcg
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
