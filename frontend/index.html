<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>OPTCG Deck Builder</title>
    <script>
      // Apply the saved light/dark choice before the page draws, to avoid a flash.
      try {
        var t = localStorage.getItem('optcg.theme.v1')
        if (t === 'light' || (!t && matchMedia('(prefers-color-scheme: light)').matches))
          document.documentElement.classList.add('light')
      } catch (e) {}
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
